<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Trade+Winds&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Login Page</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-icon" href="#"><img src="icon.png" alt="icon"></a>
            <a class="navbar-brand" href="#"><h3> Naruto</h3></a>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                    <button class="btn btn-outline-secondary" type="submit">Search</button>
                </form>
                <li class="nav-item"><a class="nav-link" href="#"><h5>About</h5></a></li>
                <li class="nav-item"><a class="nav-link" href="#"><h5>Create</h5></a></li>
                <li class="nav-item"><a class="nav-link" href="#"><h5>Explore</h5></a></li>
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button class="btn btn-outline-secondary me-md-2" type="button">Login</button>
                    <button class="btn btn-outline-secondary" type="button">Signup</button>
                </div>
            </ul>
            </div>
        </div>
    </nav>
    <form class="form-submit" action="#">
        <a class="navbar-icon" href="#"><img src="icon.png" alt="icon"></a>
        <a class="navbar-brand" href="#"><h3> Welcome to Naruto Shippuden!</h3></a> 
        <p>Discover your fav characters and have fun.</p>
        <input type="text" name="name" class="input-data" placeholder="Sasuke Uchiha">
        <input type="email" name="email" class="input-data" placeholder="sasuke@gmail.com">
        <input type="password" name="password" class="input-data" placeholder="password">
        <input type="date" name="date" class="input-data">
        <button class="btn btn-secondary" type="button">Continue</button> <br>
        <h5>Or</h5>
        <button class="btn btn-secondary" type="button">Continue with google</button> <br>
        <p>Already have an account? <a href="#">Login</a></p>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
