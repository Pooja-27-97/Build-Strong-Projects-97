<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spy*Family</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Trade+Winds&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="side-bar">
        <h1>SPY * Family</h1>
        <div class="body">
            <h2><i class="fa-brands fa-microsoft"></i> Dashboard</h2>
            <h2><i class="fa-solid fa-user-secret"></i> Spy</h2>
            <h2><i class="fa-solid fa-user-ninja"></i> Assassin</h2>
            <h2><i class="fa-solid fa-user"></i> Characters</h2>
            <h2><i class="fa-solid fa-calendar-days"></i> Missions</h2>
        </div>
        <div class="footer">
            <h2><i class="fa-brands fa-square-whatsapp" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Whatsapp"></i></h2>
            <h2><i class="fa-brands fa-youtube" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Youtube"></i></h2>
            <h2><i class="fa-brands fa-square-instagram" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Instagram"></i></h2>
        </div>
    </div>
    <div class="content">
        <div class="nav-bar">
            <div class="search">
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                    <button class="btn btn-outline-danger" type="submit">Search</button>
                </form>
            </div>
            <div class="profile">
                <h3><i class="fa-solid fa-circle-user"></i> Purple Night!</h3>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));</script>
</body>
</html>
