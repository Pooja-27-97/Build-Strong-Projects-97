<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naruto Shippuden</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fontdiner+Swanky&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="side-bar">
        <h2>Naruto Shippuden</h2>
        <hr>
        <div class="body">
            <h3><i class="fa-solid fa-house"></i> Home</h3>
            <h3><i class="fa-solid fa-ticket"></i> Movies</h3>
            <h3><i class="fa-solid fa-photo-film"></i> Episodes</h3>
            <h3><i class="fa-solid fa-heart"></i> Favourite</h3>
            <h3><i class="fa-solid fa-angles-left"></i> Logout</h3>
        </div>
        <hr>
        <div class="footer">
            <i class="fa-brands fa-square-whatsapp" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Whatsapp"></i>
            <i class="fa-brands fa-square-instagram" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Instagram"></i>
            <i class="fa-brands fa-telegram" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Telegram"></i>
            <i class="fa-brands fa-youtube" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Youtube"></i>
        </div>
    </div>
    <div class="content">
        <nav class="navbar bg-body-tertiary">
            <div class="container-fluid">
                <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                <button class="btn btn-outline-warning" type="submit">Search</button>
                </form>
            </div>
        </nav>
        <div class="cover-img"></div>
        <div class="character"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));</script>
</body>
</html>
