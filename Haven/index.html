<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Trade+Winds&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Haven</title>
</head>
<body>
    <div class="side-bar">
        <h1 class="web-name"><i class="fa-brands fa-deezer"></i> Haven</h1>
        <div class="redirect-pages">
            <h3 class="pages"><i class="fa-solid fa-house"></i> Home</h3>
            <h3 class="pages"><i class="fa-solid fa-magnifying-glass"></i> Search</h3>
            <h3 class="pages"><i class="fa-solid fa-file-zipper"></i> Your Library</h3>
            <h3 class="pages"><i class="fa-solid fa-heart"></i> Liked Songs</h3>
            <h3 class="pages"><i class="fa-solid fa-headphones"></i> Playlists</h3>
            <h3 class="pages"><i class="fa-solid fa-compact-disc"></i> Albums</h3>
            <h3 class="pages"><i class="fa-solid fa-user"></i> Artists</h3>
        </div>
        <div class="playlist">
            <h2>Your Playlists <i class="fa-solid fa-plus"></i></h2>
            <div class="card mb-3">
                <div class="row g-0">
                    <div class="col-md-4">
                    <img src="..." class="img-fluid rounded-start" alt="...">
                    </div>
                    <div class="col-md-8">
                    <div class="card-body">
                        <h5 class="card-title">Card title</h5>
                    </div>
                    </div>
                </div>
            </div>
            <div class="card mb-3">
                <div class="row g-0">
                    <div class="col-md-4">
                    <img src="..." class="img-fluid rounded-start" alt="...">
                    </div>
                    <div class="col-md-8">
                    <div class="card-body">
                        <h5 class="card-title">Card title</h5>
                    </div>
                    </div>
                </div>
            </div>
            <div class="card mb-3">
                <div class="row g-0">
                    <div class="col-md-4">
                    <img src="..." class="img-fluid rounded-start" alt="...">
                    </div>
                    <div class="col-md-8">
                    <div class="card-body">
                        <h5 class="card-title">Card title</h5>
                    </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="profile-name">
            <img src="" alt="">
            <h3>Name</h3>
        </div>
    </div>
    <div class="main-context">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
                <h3><i class="fa-solid fa-bell"></i></h3>
                </div>
            </div>
        </nav>
        <div class="song-part">
            <div class="single-song-card"></div>
            <div class="recommmendations"></div>
            <div class="recent-song-list"></div>
        </div>
        <div class="play-bar"></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js" integrity="sha512-vCSmrntNiXHtUS8NodQE28EuCwIDxuO8Lub3ljkVzzZJ7s4/3YjwRNi0xxdH5jFzGrXKi7UR0OLFtZM2JJ6Swg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
